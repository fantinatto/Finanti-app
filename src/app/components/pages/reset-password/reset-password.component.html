<app-default-login-layout
    [title]="done ? ('AUTH.RESET_DONE_TITLE' | translate) : ('AUTH.RESET_TITLE' | translate)"
    primaryBtnText=""
    secondaryBtnText="{{ 'AUTH.BACK_TO_LOGIN' | translate }}"
    (navigate)="goToLogin()"
    [disablePrimaryBtn]="true">

    <!-- Redefinição concluída -->
    <div *ngIf="done" class="done-container">
        <div class="done-icon">✅</div>
        <p class="done-text">{{ 'AUTH.RESET_DONE_TEXT' | translate }}</p>
        <button class="submit-btn" (click)="goToLogin()">
            {{ 'AUTH.SIGN_IN' | translate }}
        </button>
    </div>

    <!-- Link inválido -->
    <div *ngIf="!done && !token" class="error-message">
        {{ errorMessage }}
    </div>

    <!-- Formulário -->
    <div *ngIf="!done && token" class="form-container">
        <form [formGroup]="resetForm" (ngSubmit)="submit()">
            <app-primary-input
                formControlName="password"
                inputName="password"
                type="password"
                label="{{ 'AUTH.NEW_PASSWORD' | translate }}"
                [errorMessage]="passwordError">
                <img src="/assets/svg/pw-icon.svg" alt="Password">
            </app-primary-input>

            <app-primary-input
                formControlName="passwordConfirm"
                inputName="passwordConfirm"
                type="password"
                label="{{ 'AUTH.CONFIRM_PASSWORD' | translate }}"
                [errorMessage]="passwordConfirmError">
                <img src="/assets/svg/pw-icon.svg" alt="Password">
            </app-primary-input>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button
                type="submit"
                class="submit-btn"
                [disabled]="isLoading">
                <span *ngIf="isLoading" class="loading-spinner"></span>
                {{ 'AUTH.RESET_SUBMIT' | translate }}
            </button>
        </form>
    </div>

</app-default-login-layout>
