<div class="settings-header-wrap">
  <div class="settings-header">
    <h1>Configurações</h1>
    <p>Dados da sua conta e parâmetros da Carteira de Investimentos.</p>
  </div>

  <div class="settings-tabs">
    <button type="button" class="settings-tab" [class.active]="abaAtiva === 'perfil'" (click)="setAba('perfil')">Perfil</button>
    <button type="button" class="settings-tab" [class.active]="abaAtiva === 'carteira'" (click)="setAba('carteira')">Carteira de Investimentos</button>
  </div>
</div>

<!-- .settings-layout é estreito (560px, pensado só pro form de Perfil) — a aba Carteira usa o
     layout próprio e mais largo de app-carteira, por isso fica fora desse wrapper. -->
<div class="settings-layout" *ngIf="abaAtiva === 'perfil'">

  <div class="estado-loading" *ngIf="carregando">
    <div class="spinner-lg"></div>
    <span>Carregando perfil...</span>
  </div>

  <form class="settings-card" *ngIf="!carregando && perfil" (ngSubmit)="salvar()">

    <div class="campo">
      <label for="displayName">Nome</label>
      <input id="displayName" type="text" [(ngModel)]="displayName" name="displayName" required />
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" type="email" [value]="perfil.primaryEmail" disabled />
    </div>

    <div class="campo">
      <label for="avatarUrl">URL do avatar</label>
      <input id="avatarUrl" type="text" [(ngModel)]="avatarUrl" name="avatarUrl" placeholder="https://..." />
    </div>

    <div class="campo">
      <label for="birthDate">Data de nascimento</label>
      <input id="birthDate" type="date" [(ngModel)]="birthDate" name="birthDate" />
      <p class="campo-legenda">Usada pra calcular sua idade nas regras de rebalanceamento da Carteira de Investimentos.</p>
    </div>

    <div class="acoes">
      <button type="submit" class="btn-salvar" [disabled]="salvando">{{ salvando ? 'Salvando...' : 'Salvar' }}</button>
      <span class="msg-sucesso" *ngIf="salvoComSucesso">Salvo com sucesso.</span>
      <span class="msg-erro" *ngIf="erro">{{ erro }}</span>
    </div>

  </form>

</div>

<app-carteira *ngIf="abaAtiva === 'carteira'"></app-carteira>
