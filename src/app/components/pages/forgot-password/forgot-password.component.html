<app-default-login-layout
    [title]="sent ? ('AUTH.FORGOT_SENT_TITLE' | translate) : ('AUTH.FORGOT_TITLE' | translate)"
    primaryBtnText=""
    secondaryBtnText="{{ 'AUTH.BACK_TO_LOGIN' | translate }}"
    (navigate)="goToLogin()"
    [disablePrimaryBtn]="true">

    <!-- Enviado com sucesso -->
    <div *ngIf="sent" class="sent-container">
        <div class="sent-icon">✉️</div>
        <p class="sent-text">{{ 'AUTH.FORGOT_SENT_TEXT' | translate }}</p>
        <button class="submit-btn" (click)="goToLogin()">
            {{ 'AUTH.BACK_TO_LOGIN' | translate }}
        </button>
    </div>

    <!-- Formulário -->
    <div *ngIf="!sent" class="form-container">
        <p class="description">{{ 'AUTH.FORGOT_DESCRIPTION' | translate }}</p>

        <form [formGroup]="forgotForm" (ngSubmit)="submit()">
            <app-primary-input
                formControlName="email"
                inputName="email"
                type="email"
                label="{{ 'AUTH.EMAIL' | translate }}"
                placeholder="fulano@gmail.com"
                [errorMessage]="emailError">
                <img src="/assets/svg/mail-icon.svg" alt="Email">
            </app-primary-input>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button
                type="submit"
                class="submit-btn"
                [disabled]="isLoading">
                <span *ngIf="isLoading" class="loading-spinner"></span>
                {{ 'AUTH.FORGOT_SUBMIT' | translate }}
            </button>
        </form>

        <button class="back-btn" (click)="goToLogin()">
            ← {{ 'AUTH.BACK_TO_LOGIN' | translate }}
        </button>
    </div>

</app-default-login-layout>
