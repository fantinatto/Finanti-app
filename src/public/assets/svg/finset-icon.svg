<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2433"/>
      <stop offset="100%" stop-color="#152E42"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3BD671"/>
      <stop offset="100%" stop-color="#2DBC63"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B6EF6"/>
      <stop offset="100%" stop-color="#3E3BAF"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rounded square badge -->
  <rect x="24" y="24" width="464" height="464" rx="56" fill="url(#bg)" />

  <!-- Stylized F (geometric) -->
  <g transform="translate(116,112)" filter="url(#shadow)">
    <!-- vertical stem -->
    <rect x="64" y="0" width="56" height="288" rx="12" fill="white" opacity="0.96"/>
    <!-- top arm -->
    <rect x="64" y="0" width="176" height="48" rx="12" fill="white" opacity="0.96"/>
    <!-- mid arm -->
    <rect x="64" y="120" width="136" height="48" rx="12" fill="white" opacity="0.96"/>
  </g>

  <!-- growth tick overlay (finance motif) -->
  <g transform="translate(120,292)">
    <polyline points="0,72 74,18 120,42 208,-18 264,-48" fill="none" stroke="url(#mint)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- endpoint circle -->
    <circle cx="264" cy="-48" r="10" fill="#3BD671"/>
  </g>

  <!-- subtle diagonal highlight -->
  <path d="M64,80 C220,120 292,84 448,64 L448,128 C292,148 220,184 64,144 Z" fill="white" opacity="0.04"/>
</svg>
